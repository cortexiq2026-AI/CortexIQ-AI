[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-answer-auditor"
version = "0.1.0"
description = "A post-generation verification/audit layer for LLM answers: extract claims, check evidence, score trust."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.40.0"]
search = ["httpx>=0.27.0"]
all = ["anthropic>=0.34.0", "openai>=1.40.0", "httpx>=0.27.0"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["ai_answer_auditor*"]
