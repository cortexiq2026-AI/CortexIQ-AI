[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-supervisor"
version = "0.1.0"
description = "A completion gate for AI agent runs: derives a checklist of success criteria from the task and blocks 'done' until every required item is satisfied."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.40.0"]
search = ["httpx>=0.27.0"]
all = ["anthropic>=0.34.0", "openai>=1.40.0", "httpx>=0.27.0"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["ai_workflow_supervisor*"]
