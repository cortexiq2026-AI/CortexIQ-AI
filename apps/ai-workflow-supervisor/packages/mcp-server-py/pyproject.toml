[project]
name = "ai-workflow-supervisor-mcp"
version = "0.1.0"
description = "MCP server wrapper exposing AI Workflow Supervisor as an agent tool."
requires-python = ">=3.10"
dependencies = [
    "ai-workflow-supervisor",
    "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
