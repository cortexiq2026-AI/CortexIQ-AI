[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-completeness-checker"
version = "0.1.0"
description = "A coverage/completeness analyzer for AI answers and documents: checks what's missing, not what's wrong."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.40.0"]
ollama = ["httpx>=0.27.0"]
all = ["anthropic>=0.34.0", "openai>=1.40.0", "httpx>=0.27.0"]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["ai_completeness_checker*"]
